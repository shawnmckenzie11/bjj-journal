const P_RAW=[
[1,"Connection","Preventing, promoting or predicting your opponent's movement using the 32 methods of connection."],
[2,"Detachment","Achieving optimal efficiency in transitions through deliberate disconnection from your opponent."],
[3,"Distance","Neutralizing the application of a technique against you by disrupting the optimal distance from which it is applied."],
[4,"Pyramid","Optimizing connections with the ground and with your opponent to maximize balance and control at all times."],
[5,"Creation","Using targeted actions to force specific reactions in your favor."],
[6,"Acceptance","Being first to accept the inevitability of an action so that you are best prepared for the outcome."],
[7,"Velocity","Constantly changing your operational speed to confuse and overwhelm your opponent."],
[8,"Clock","Disrupting the anticipated timing of your opponent's techniques to reduce or eliminate their effectiveness."],
[9,"River","Bypassing resistance by flowing around it."],
[10,"Frame","Substituting muscular strength with skeletal structure from every position in the fight."],
[11,"Kuzushi","Breaking your opponent's balance in your favor."],
[12,"Reconnaissance","Gathering information about your opponent's behavior for use against them."],
[13,"Prevention","Putting your opponent's objectives before your own to prevent their progress."],
[14,"Tension","Capitalizing on the offensive and defensive opportunities enabled by tension."],
[15,"Fork","Creating positional dilemmas that force your opponent to choose how they lose."],
[16,"Posture","Neutralizing a technique by disrupting the optimal posture from which it is applied."],
[17,"False Surrender","Feigning surrender so that your opponent lets their guard down."],
[18,"Depletion","Draining your opponent's physical and mental energy using targeted actions and connections."],
[19,"Isolation","Tactically containing of one or more of your opponent's limbs for your advantage."],
[20,"Sacrifice","Giving up something of actual or perceived value to gain a tactical advantage in another form."],
[21,"Momentum","Capitalizing on mass in motion to maximize efficiency against your opponent."],
[22,"Pivot","Increasing the effectiveness of a technique by changing the angle of its application."],
[23,"Tagalong","Seizing the \u201cfree rides\u201d in the fight to save your energy while depleting the opponent's."],
[24,"Overload","Disproportionate application of your resources to target a specific part of your opponent's body."],
[25,"Anchor","Pinning any part of your or your opponent's body to a surface to inhibit mobility."],
[26,"Ratchet","Creating persistent incremental advancements in one direction while preventing motion in the opposite direction."],
[27,"Buoyancy","Capitalizing on offensive and defensive surfacing opportunities throughout the fight."],
[28,"Head Control","Controlling your opponent's head to limit or direct their movement."],
[29,"Redirection","Reducing your opponent's effectiveness by controlling the direction of their energy."],
[30,"Mobility","Moving yourself when your opponent can't be moved."],
[31,"Centerline","Limiting your opponent's potential by taking control of their centerline."],
[32,"Grandmaster","Using the 32 Principles to continuously improve jiu-jitsu."]];

const COACH={
10:{cg:"CG bottom: forearm across his collarbone stops him smashing down to your chest.",mount:"Mount bottom: frame both hands on his hips before you bridge, so your arms aren't pushing on his chest.",side:"Side bottom: forearm in his neck, other hand on his hip, makes space to shrimp.",stand:"Standing: hand on bicep or collar keeps him from crashing in on your legs."},
4:{cg:"CG top: knees wide, hips low, hands on his hips so sweeps don't tip you.",mount:"Mount top: when he bridges, widen your knees and post a hand instead of riding high.",side:"Side top: weight on him, toes on the mat, not up on your knees.",stand:"Standing: feet shoulder-width and staggered so a push or pull doesn't move you."},
1:{cg:"CG bottom: pull his head down and keep your knees tight to stop him posturing up.",mount:"Mount top: chest on his, knees tight to his sides so he can't build space.",side:"Side top: crossface plus far hip block glues your shoulder to his jaw.",stand:"Standing: collar-and-sleeve grip lets you feel his weight shift before he moves."},
16:{cg:"CG bottom: break him down with legs and collar grip so his arms are stuck carrying his weight.",mount:"Mount bottom: pull his head down or turn his shoulders so he can't sit tall and strike or set up attacks.",side:"Side bottom: push his head away from your hips so he can't stay square on you.",stand:"Standing: pull his head down with a collar grip so he can't shoot cleanly."},
3:{cg:"CG bottom: if he stands, open the guard and keep feet on his hips to manage the gap.",mount:"Mount bottom: stay too close for strikes (hug) or too far for his weight (frames, shrimp), never in between.",side:"Side bottom: keep knee and elbow together so he never gets close enough to take mount.",stand:"Standing: stay out of reach or close all the way to a clinch; the middle range is where you get taken down."},
28:{cg:"CG bottom: hold his head down and his posture follows, setting up arm drags and kimuras.",mount:"Mount top: arm under his head stops his bridge and upa from going anywhere.",side:"Side top: crossface turns his head away so he can't turn in and get to his knees.",stand:"Standing: hand behind his head, snapping it down, pulls his whole body forward and off balance."},
25:{cg:"CG top: pin one hip to the mat with your hand to start opening the guard.",mount:"Mount top: heel hooked under his leg pins that side and kills his escape there.",side:"Side top: pin his far arm to the mat to set up the kimura or step over to mount.",stand:"Standing: pin his hand to your collar or chest so he can't grip with it."},
19:{cg:"CG bottom: trap one arm across your body; armbar, triangle or kimura comes next.",mount:"Mount bottom: trap arm and foot on the same side before you bridge (upa trap).",side:"Side top: separate his near arm from his body for the americana or kimura.",stand:"Standing: a two-on-one on one arm gives a single focus for your entry."}};

{id:"gr1",cat:"Guard retention",start:"Open guard bottom, he starts a knee-cut",ps:[10,30,4],out:"Guard recovered (knee shield / closed guard)",mech:["Inside forearm frames on his collar-side shoulder; knee shield across his hips","Hip escape away from the cutting knee to make room","Re-pummel the knee inside and re-square your hips"],how:{10:"Bones, not biceps, hold his weight off your chest",30:"He's heavy, so you move: shrimp your hips out instead of pushing him",4:"Plant foot + shoulder give a stable base to recover from"},mist:["Pushing with straight arms that get collapsed","Flat on your back with no hip escape","Frames on his head instead of shoulder/hip line"],t:{obj:"When a passer cuts the knee, frame + shrimp before he settles.",cue:"Forearm on shoulder, then hips away",sit:"Positional rounds from open guard",succ:"Re-guard at least twice in rolls"}},
{id:"gr2",cat:"Guard retention",start:"Open guard bottom, he's standing/leaning in",ps:[3,1,22],out:"Feet stay between you and him",mech:["Feet on hips/biceps keep him at leg length","Grip a sleeve to feel his push","Turn on your back to face him as he circles"],how:{3:"Keep him at foot distance so his pass can't start",1:"Sleeve/foot connection tells you where he's going",22:"Rotate your angle so your legs stay pointed at him"},mist:["Letting feet drop to the mat","Following with your head instead of hips","Grabbing nothing"],t:{obj:"Keep at least one foot on his hip when he circles.",cue:"Feet face him",sit:"Open guard rounds",succ:"Never flattened while he's standing"}},
{id:"es1",cat:"Escapes",start:"Side control bottom",ps:[10,30,9],out:"Recover guard or come up to knees",mech:["Near forearm in his neck/collarbone, far hand on his hip","Bridge slightly, then shrimp hips away","Insert near knee into the space; if he blocks, turn to knees"],how:{10:"Frames create the space muscles can't hold",30:"You move your hips out, not him off",9:"If knee insertion is blocked, flow to turtle/knees instead"},mist:["Pushing him off with straight arms","Turning toward him and giving your back","Shrimping without framing first"],t:{obj:"From side bottom, frame neck + hip before any shrimp.",cue:"Frame first, move second",sit:"Side control escapes in rolls",succ:"Space created on 2 of my side control bottoms"}},
{id:"es2",cat:"Escapes",start:"Turtle / knees, he's on my back side",ps:[27,1,22],out:"Back to guard or stand up",mech:["Elbows tight to knees, protect the neck","Grip his wrist on your chest","Sit to your hip and turn in, or post and stand"],how:{27:"Surface: get up when he's light",1:"Wrist grip controls his hooks/arm",22:"Turn the angle toward him to face him"},mist:["Reaching out a hand to post too early","Staying flat on the belly"],t:{obj:"From turtle, grab one wrist then sit-out toward him.",cue:"Wrist, hip, turn",sit:"Turtle spots in rolls",succ:"One recovery to guard"}}, 
{id:"md1",cat:"Mount defence",start:"Mount bottom, he's low and heavy",ps:[19,11,21],out:"Upa reversal to top in his guard",mech:["Trap arm: grip his wrist/elbow on one side","Trap foot: your foot outside his on the same side","Bridge high over the shoulder on the trapped side and roll"],how:{19:"Trap one arm and leg so he has no post on that side",11:"The bridge breaks his balance toward the trapped side",21:"Commit the roll while his weight moves"},mist:["Bridging straight up","Bridging toward the untrapped side","Letting go of the arm"],t:{obj:"Trap arm and foot on the same side before every bridge.",cue:"Arm, foot, then bridge",sit:"Mount bottom",succ:"Attempt the trap every time I'm mounted"}},
{id:"md2",cat:"Mount defence",start:"Mount bottom, he's sitting high",ps:[10,30,3],out:"Elbow-knee escape to half/full guard",mech:["Hands on his hips, elbows in","Small bridge, then shrimp to one side","Bring knee to elbow and slide it under his leg"],how:{10:"Frames on hips, not chest",30:"Turn on your side and move your hips",3:"Keep elbows close so he can't climb"},mist:["Pushing on chest (armbar risk)","Elbows flaring out"],t:{obj:"Frames on hips and an elbow-knee escape every time he sits high.",cue:"Hips, not chest",sit:"Mount bottom",succ:"Recover half guard once"}},
{id:"gp1",cat:"Guard passing",start:"Closed guard top",ps:[16,4,25],out:"Guard opened, ready to pass",mech:["Hands on his hips/belt, sit back on heels, head up","One knee up, base wide","Pin a hip and stand or angle to open the legs"],how:{16:"Don't let him break your posture (and disrupt his)",4:"Wide base so sweeps don't tip you",25:"Pin the hip to stop him re-angling"},mist:["Hands on the mat","Head down in his chest","Standing without posture"],t:{obj:"Posture up with hands on hips before trying to open the guard.",cue:"Back straight, hands on hips",sit:"Closed guard top",succ:"No broken posture during guard opening"}},
{id:"gp2",cat:"Guard passing",start:"Open guard top, standing",ps:[25,24,26],out:"Pass to side control",mech:["Pin one knee/shin to the mat","Weight on that leg, step around","Chest to chest, crossface, settle"],how:{25:"Pin his leg so it can't come back",24:"Put multiple resources on one leg",26:"Each step gains; never give it back"},mist:["Passing without controlling legs","Letting him re-guard by backing off"],t:{obj:"Pin one leg before every step around.",cue:"Pin, then walk",sit:"Open guard top",succ:"One pass that ends in side control"}},
{id:"sw1",cat:"Sweeps",start:"Closed guard bottom",ps:[11,19,21],out:"Scissor/hip-bump sweep to mount",mech:["Break posture, then he posts up","Trap the posting arm (hip bump) or sleeve (scissor)","Sit up/scissor while his weight is moving"],how:{11:"Off-balance him forward first",19:"Remove his post on the sweep side",21:"Use his motion when he sits back"},mist:["Sweeping a perfectly balanced partner","No grip on the post arm"],t:{obj:"Break his balance forward before any sweep attempt.",cue:"Pull, then sweep",sit:"Closed guard bottom",succ:"2 off-balance attempts per roll"}},

{id:"sc2",cat:"Side control",start:"Side control top, he frames",ps:[9,26,30],out:"Transition to mount or knee on belly",mech:["Flow around his frame, don't push into it","Advance knee to belly","Slide knee across to mount"],how:{9:"Flow around the frame",26:"Each step forward is held",30:"You move around a static opponent"},mist:["Forcing through frames","Giving back space"],t:{obj:"When framed, move around instead of pushing into the frame.",cue:"Around, not through",sit:"Side top",succ:"One advance"}},
{id:"mc1",cat:"Mount control",start:"Mount top",ps:[4,25,28],out:"Stable mount",mech:["Low mount, grapevine or knees tight","Post a hand when he bridges","Head control to kill bridge"],how:{4:"Wide base",25:"Pin his legs/hips",28:"Arm under head"},mist:["Sitting high too early","Hands on his chest"],t:{obj:"Post a hand and widen knees on every bridge.",cue:"Post and widen",sit:"Mount top",succ:"Not reversed once"}},
{id:"mc2",cat:"Mount control",start:"Mount top, he turns",ps:[15,19,22],out:"Armbar or back take",mech:["As he turns, isolate arm","Climb to S-mount or take back","Choose the open option"],how:{15:"Two options so he loses either way",19:"Contain the arm",22:"Change angle to S-mount"},mist:["Rushing the armbar"],t:{obj:"When he turns, go to S-mount and check both options.",cue:"Turn means arm or back",sit:"Mount top",succ:"One S-mount"}},

const B=40,n=Math.max(1,Math.ceil(up.length/B));for(let i=0;i<n;i++){const chunk=up.slice(i*B,i*B+B),last=i==n-1;const body={v:1,upserts:chunk.map(id=>({entry_id:id,rows:rows(cur.get(id))})),deletes:last?del:[],partners:partners()};if(last&&full)body.keep=S.entries.filter(e=>!e.example).map(e=>e.id);
const sent={};chunk.concat(last?del:[]).forEach(id=>sent[id]=o.q[id].t);await post(o.url,body);o=st();for(const id in sent)if(o.q[id]&&o.q[id].t==sent[id])delete o.q[id];if(last&&full)delete o.full;delete o.err;o.last=Date.now();put(o);show()}}
catch(x){fail(st(),x)}finally{busy=false}}
